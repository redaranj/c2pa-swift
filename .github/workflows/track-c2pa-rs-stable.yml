# Tracks the latest published c2pa-rs release (upstream's `stable` line).
# Supersedes the former update-c2pa-core-sdk.yml, which bumped main without
# ever building the result, took the most recently published release rather
# than the highest version, and had no prerelease filter.
name: Track c2pa-rs stable

on:
  schedule:
    # TEMPORARY: every 30 minutes for fork validation. Revert to "0 */6 * * *"
    # before proposing this upstream -- see docs/ci/c2pa-rs-tracking.md.
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Pin this exact version instead of resolving one"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Resolve and build, but do not push or file issues"
        required: false
        default: false
        type: boolean

# Must be declared here: reusable-workflow permissions can only be reduced
# through the call chain, never elevated, so omitting this would leave the
# force-push in track-c2pa-rs.yml unauthorised on a read-only default token.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  track:
    uses: ./.github/workflows/track-c2pa-rs.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      mode: stable
      branch: track/c2pa-rs-stable
      version: ${{ inputs.version || '' }}
      # workflow_dispatch booleans arrive as strings; comparing both ways is
      # correct for either, and yields false on schedule/push where inputs
      # are empty.
      dry_run: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
